# /etc/nginx/sites-available/bot.conf  ->  symlink into sites-enabled, then `nginx -t && systemctl reload nginx`
# Replace bot.example.com. Get the cert with:  certbot --nginx -d bot.example.com

server {
    listen 80;
    server_name bot.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name bot.example.com;

    ssl_certificate     /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;

    # Telegram posts small JSON updates; nothing else needs a large body
    client_max_body_size 1m;

    location /telegram/webhook {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }

    # everything else is closed
    location / {
        return 404;
    }
}
