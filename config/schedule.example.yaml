# Copy to config/schedule.yaml. Times are local to the VPS (see TZ in .env).
# Each task runs through the refine loop and is delivered to Telegram unless it sets `deliver_to`.

# --- LLM provider chain: tried top to bottom, falls through on 429 / quota / auth errors ---
llm:
  chain:
    - provider: groq
      model: llama-3.3-70b-versatile
      rpm: 30
      rpd: 14400
    - provider: gemini
      model: gemini-2.0-flash
      rpm: 15
      rpd: 1500
    - provider: openrouter
      model: "meta-llama/llama-3.3-70b-instruct:free"
      rpm: 20
      rpd: 200
    - provider: ollama          # local fallback, only when every hosted provider is exhausted
      model: llama3.1:8b
  embeddings:
    - provider: gemini
      model: text-embedding-004
    - provider: ollama
      model: nomic-embed-text

# --- Global default for the self-evaluating refine loop. Per-task `loop:` overrides these. ---
defaults:
  loop:
    max_iterations: 3
    score_threshold: 0.85         # 0..1; stop early once a draft scores at/above this
    judge_model: null             # null = same model self-scores; set "provider:model" for LLM-as-judge
    keep_traces: true             # persist every draft + score to loop_traces
    criteria:
      - grounded in the provided sources, no invented facts
      - relevant to my stated interests
      - correct dates and numbers
      - no filler or hedging
      - length fits the channel

tasks:
  - name: email-digest
    at: "07:00"
    source: email
    action: digest
    params:
      window_hours: 24
      only_unread: true
      group_by: sender
      filter: "skip newsletters and receipts; flag anything that needs a reply"

  - name: morning-news
    at: "07:30"
    source: scraping
    action: brief
    params:
      categories: [news, tech]
      subcategories: [world, mena, ai, startups]
      max_items: 8
    loop:
      max_iterations: 4
      score_threshold: 0.9
      judge_model: "gemini:gemini-2.0-flash"

  - name: weather-agenda
    at: "08:00"
    source: connector
    connector: weather
    action: today
    params:
      location: "Amman, JO"

  - name: markets
    at: "13:00"
    source: scraping
    action: brief
    params:
      categories: [markets]
      subcategories: [equities, crypto, macro]
      watchlist: [AAPL, MSFT, BTC-USD]
      max_items: 6

  - name: daily-wrap
    at: "21:00"
    source: core
    action: recap
    params:
      include: [asked_today, flagged_followups, new_in_personal]
