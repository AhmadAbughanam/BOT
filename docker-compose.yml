services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: bot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot"]
      interval: 5s
      timeout: 3s
      retries: 10

  # `docker compose --profile full up` also runs the API container.
  api:
    profiles: ["full"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://bot:bot@db:5432/bot
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m bot.scraping --mirror &&
             uvicorn bot.main:app --app-dir src --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
